name: 설치 파일 만들기

on:
  push:
    branches: [main]
    paths-ignore: ["tools/**", "docs/**", "README.md", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk region-radio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: region-radio-apk
          path: region-radio.apk
      # 휴대전화에서 바로 받을 수 있도록 릴리스에 설치 파일을 붙인다
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 지역 라디오 빌드 ${{ github.run_number }}
          files: region-radio.apk
          make_latest: "true"
